spring:
  application:
    name: minerva
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/minerva}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: Esquema creado manualmente antes de Flyway
    validate-on-migrate: true
  jpa:
    open-in-view: false
    hibernate:
      # Flyway administra el esquema; Hibernate solamente valida/mapea entidades.
      ddl-auto: none
    show-sql: ${JPA_SHOW_SQL:false}

server:
  port: ${PORT:${SERVER_PORT:8080}}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
        add-additional-paths: true
      group:
        readiness:
          include: readinessState,db

jwt:
  secret: ${JWT_SECRET:}
  expiration-ms: ${JWT_EXPIRATION_MS:86000000}

minerva:
  report:
    zone: ${MINERVA_REPORT_ZONE:America/Lima}
  demo:
    catalog:
      enabled: false
      actor-username: ${MINERVA_DEMO_CATALOG_ACTOR_USERNAME:admin}
  bootstrap:
    enabled: ${MINERVA_BOOTSTRAP_ENABLED:false}
    admin:
      dni: ${MINERVA_ADMIN_DNI:}
      names: ${MINERVA_ADMIN_NAMES:}
      last-names: ${MINERVA_ADMIN_LAST_NAMES:}
      phone: ${MINERVA_ADMIN_PHONE:}
      email: ${MINERVA_ADMIN_EMAIL:}
      username: ${MINERVA_ADMIN_USERNAME:}
      password: ${MINERVA_ADMIN_PASSWORD:}
