spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false

jwt:
  secret: TWluZXJ2YS1JbnRlZ3JhdGlvbi1UZXN0LUtleS0yMDI2LUZpeGVkLVNlY3JldCE=
  expiration-ms: 3600000

minerva:
  bootstrap:
    enabled: false
