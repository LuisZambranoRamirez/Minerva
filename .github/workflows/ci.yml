name: CI

on:
  push:
    branches:
      - Diego
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: minerva/pom.xml

      - name: Make Maven Wrapper executable
        run: chmod +x minerva/mvnw

      - name: Run tests
        run: ./minerva/mvnw -f ./minerva/pom.xml clean test
